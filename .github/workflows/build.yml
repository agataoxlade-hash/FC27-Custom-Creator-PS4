name: Build FC27 Custom Creator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Prepare package icon
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          mkdir -p sce_sys/about .tools
          python3 tools/generate_icon.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get OpenOrbis packaging tools
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/create-fself.git /tmp/create-fself
          git clone --depth 1 https://github.com/OpenOrbis/create-gp4.git /tmp/create-gp4
          cd /tmp/create-fself/cmd/create-fself
          CGO_ENABLED=0 go build -modfile=go-linux.mod -o "$GITHUB_WORKSPACE/.tools/create-fself" .
          cd /tmp/create-gp4/cmd/create-gp4
          CGO_ENABLED=0 go build -o "$GITHUB_WORKSPACE/.tools/create-gp4" .
          chmod +x "$GITHUB_WORKSPACE/.tools/create-fself" "$GITHUB_WORKSPACE/.tools/create-gp4"

      - name: Build PS4 package with OpenOrbis Docker toolchain
        run: |
          docker run --rm --user 0:0 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -lc 'set -eu
              mkdir -p "$OO_PS4_TOOLCHAIN/bin/linux"
              cp .tools/create-fself "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"
              cp .tools/create-gp4 "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4"
              chmod +x "$OO_PS4_TOOLCHAIN/bin/linux/create-fself" "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4"
              RIGHT_SPRX="$(find "$OO_PS4_TOOLCHAIN" -name right.sprx -type f | head -n 1)"
              test -n "$RIGHT_SPRX"
              cp "$RIGHT_SPRX" sce_sys/about/right.sprx
              make
              test -s IV0000-FC27C0001_00-FC27CREATOR00000.pkg
            '

      - name: Save PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: FC27-Custom-Creator-PKG
          path: "*.pkg"
          if-no-files-found: error
          retention-days: 30
